<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ステージ1 草原 v2</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#111; font-family:sans-serif;
    touch-action:none; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #game { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:#9fd8ff; }
  #pad { position:fixed; inset:0; display:none; z-index:2; }
  #pad.show { display:block; }
  .btn { position:absolute; border-radius:50%; background:rgba(255,255,255,0.22); border:2px solid rgba(255,255,255,0.5);
    color:#fff; font-size:30px; display:flex; align-items:center; justify-content:center; pointer-events:auto; }
  .btn.on { background:rgba(255,255,255,0.5); transform:scale(0.94); }
  #bL { left:calc(16px + env(safe-area-inset-left)); bottom:24px; width:88px; height:88px; border-radius:20px; }
  #bR { left:calc(110px + env(safe-area-inset-left)); bottom:24px; width:88px; height:88px; border-radius:20px; }
  #bA { right:calc(120px + env(safe-area-inset-right)); bottom:20px; width:92px; height:92px; }
  #bJ { right:calc(16px + env(safe-area-inset-right)); bottom:70px; width:96px; height:96px; }
  #fs { right:12px; top:12px; width:44px; height:44px; font-size:20px; border-radius:10px; }
  #rotate { position:fixed; inset:0; display:none; z-index:3; background:#111; color:#fff; font-size:22px;
    align-items:center; justify-content:center; text-align:center; }
  @media (orientation: portrait) { body.touch #rotate { display:flex; } }
</style>
</head>
<body>
<canvas id="game" width="800" height="400"></canvas>
<div id="pad">
  <div class="btn" id="bL" data-key="left">◀</div>
  <div class="btn" id="bR" data-key="right">▶</div>
  <div class="btn" id="bA" data-key="attack">⚔</div>
  <div class="btn" id="bJ" data-key="jump">⤒</div>
  <div class="btn" id="fs" data-key="fs">⛶</div>
</div>
<div id="rotate">📱↻<br>横向きにしてください</div>
<script>
// ================= 画面 =================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const VW = 800, VH = 400;
function fit() {
  const s = Math.min(innerWidth / VW, innerHeight / VH);
  canvas.style.width = VW * s + 'px'; canvas.style.height = VH * s + 'px';
}
addEventListener('resize', fit); fit();

// ================= 定数 =================
const GRAVITY = 0.6, MOVE_SPEED = 4, JUMP_POWER = 12, FALL_MAX = 14;
const COYOTE = 6, JUMP_BUFFER = 8, ATTACK_BUFFER = 8;
const STAGE = 1;
const MAX_HP_BY_STAGE = [3, 4, 5, 6, 7, 8, 9, 10];        // ステージ1〜8の最大HP
const MAX_HP = MAX_HP_BY_STAGE[STAGE - 1], FALL_DAMAGE = 2, INVINCIBLE = 60;
const SWING_TIME = 16, SWING_COOLDOWN = 20, SWORD_REACH = 54;
const WORLD_W = 16200, DT = 1 / 60;

// ================= ステージデータ =================
const solids = [], movers = [], enemyDefs = [], heartDefs = [];
const g = (x1, x2, y = 360) => solids.push({ x: x1, y, w: x2 - x1, h: 600 });
const m = (x, y, w, ax, ay, period, phase = 0) =>
  movers.push({ bx: x, by: y, w, h: 14, ax, ay, period, phase, x, y, dx: 0, dy: 0 });
const E = (type, x, opt = {}) => enemyDefs.push({ type, sx: x, ...opt });
const heart = (x, yOff = 50) => heartDefs.push({ x, yOff });
function topAt(x) { let y = 999; for (const s of solids) if (x >= s.x && x < s.x + s.w && s.y < y) y = s.y; return y; }

// ---- 前半（約2分） ----
g(0, 900);                 E('walk', 500); E('walk', 760);
m(980, 330, 90, 60, 0, 3);                                    // 穴1
g(1150, 2000);             E('walk', 1350); E('shoot', 1600); E('hop', 1800);
m(1900, 280, 80, 0, 80, 3.5);                                 // 高台へのリフト
g(2000, 2600, 200);        E('bee', 2300); E('walk', 2450, { range: 80 });
g(2600, 3600);             E('walk', 2900); E('boar', 3150);  // 谷（落ちても戦って登れる）
m(2700, 200, 90, 60, 0, 3); m(2950, 200, 90, 0, 40, 2.5); m(3250, 200, 90, 70, 0, 3, 1);
m(3500, 280, 80, 0, 80, 3);                                   // 谷から上がるリフト
g(3600, 4200, 200);        E('walk', 3800); E('shoot', 4100); heart(3900);
g(4200, 5000);             E('hop', 4450); E('boar', 4700); E('bee', 4850);
m(5080, 320, 80, 50, 0, 2.5); m(5280, 300, 80, 0, 50, 3);     // 穴2
g(5400, 6400);             E('shoot', 5700); E('walk', 5900); E('walk', 6100); E('bee', 6250); heart(5500);
m(6300, 300, 80, 0, 60, 3);
g(6400, 7000, 240);        E('boar', 6800);
g(7000, 8200);             heart(7550);
const CHECKPOINT_X = 7600;
// 前半の雑魚の群れ（小さいスライム・1撃で倒せる）
const crowd = (x1, x2, n) => { for (let i = 0; i < n; i++) E('mini', x1 + (x2 - x1) * (i + 0.5) / n, { range: 40 + (i % 3) * 20 }); };
crowd(300, 850, 6); crowd(1200, 1550, 5); crowd(2050, 2550, 4); crowd(2650, 3500, 8);
crowd(3650, 4150, 4); crowd(4250, 4950, 6); crowd(5450, 6350, 7); crowd(6450, 6950, 4);
// 前半の敵はすべて体力1
enemyDefs.forEach(d => { if (d.sx < CHECKPOINT_X) d.hp = 1; });

// ---- 後半（約2分） ----
// 中間地点のまわり（x=7000〜8300）は敵を置かない
m(8280, 320, 70, 50, 0, 1.8); m(8450, 280, 70, 0, 60, 2); m(8590, 320, 70, 40, 0, 1.6);   // 穴3
g(8700, 9600);             E('bee', 8900); E('bee', 9050); E('boar', 9300); E('shoot', 9550);
m(9500, 280, 80, 0, 80, 2.6);
g(9600, 9900, 200);
g(9900, 11000);            E('boar', 10200); E('hop', 10500); E('walk', 10750); E('shoot', 10950);
m(10000, 200, 70, 60, 0, 2); m(10250, 180, 70, 0, 50, 2.2); m(10500, 200, 70, 80, 0, 1.8, 1); m(10780, 200, 70, 60, 0, 2.2);
m(10900, 280, 80, 0, 80, 3);
g(11000, 11600, 200);      E('walk', 11300); E('bee', 11450); heart(11100);
g(11600, 12600);           E('shoot', 11900); E('boar', 12200); E('hop', 12400); heart(12550);
m(12680, 320, 70, 50, 0, 1.5); m(12850, 260, 70, 0, 70, 2); m(13000, 320, 60, 40, 0, 1.4); // 穴4
g(13100, 14450);           E('bee', 13300); E('walk', 13500); E('shoot', 13700); E('boar', 14000); E('bee', 14200); heart(14350);
g(14450, 16200);           heart(14800);
const ARENA_L = 15000, ARENA_R = 15900;
solids.push({ x: ARENA_R, y: -600, w: 300, h: 1200 });
const gate = { x: ARENA_L - 40, y: -600, w: 40, h: 960, active: false };

// ================= 状態 =================
const player = { w: 28, h: 40 };
let enemies = [], hearts = [], shots = [], particles = [], boss;
let t = 0, cameraX = 0, state = 'title', checkpoint = 0, attempts = 1, playTime = 0;
let deadTimer = 0, shake = 0, clearTimer = 0, hitStop = 0, swingId = 0, damageFlash = 0;

const ENEMY_STATS = {
  mini:  { w: 22, h: 18, hp: 1, dmg: 1 },
  walk:  { w: 30, h: 26, hp: 2, dmg: 1 },
  hop:   { w: 30, h: 28, hp: 2, dmg: 1 },
  shoot: { w: 30, h: 40, hp: 3, dmg: 1 },
  bee:   { w: 26, h: 22, hp: 1, dmg: 1 },
  boar:  { w: 44, h: 30, hp: 3, dmg: 2 },
};
function resetWorld() {
  enemies = enemyDefs.map(d => {
    const s = ENEMY_STATS[d.type], floor = topAt(d.sx + 15);
    const e = { ...s, ...d, maxHp: d.hp || s.hp, x: d.sx, floor, y: floor - s.h, vx: d.type === 'walk' ? -1.6 : 0, vy: 0,
      dir: -1, timer: 0, state: 'idle', alive: true, active: false, flash: 0, lastSwing: -1 };
    e.min = d.sx - (d.range || 110); e.max = d.sx + (d.range || 110);
    if (d.type === 'bee') { e.baseY = floor - 150; e.y = e.baseY; }
    return e;
  });
  hearts = heartDefs.map(h => ({ x: h.x, y: topAt(h.x) - h.yOff, taken: false }));
  shots = []; particles = [];
  boss = { x: 15700, y: 300, w: 90, h: 60, vx: 0, vy: 0, hp: 12, maxHp: 12, dir: -1, state: 'wait',
    timer: 0, hopped: false, flash: 0, lastSwing: -1 };
  gate.active = false;
}
function respawn() {
  const sx = checkpoint ? CHECKPOINT_X : 50;
  Object.assign(player, { x: sx, y: topAt(sx) - 40, vx: 0, vy: 0, ground: null, coyote: 0, jbuf: 0, abuf: 0,
    face: 1, hp: MAX_HP, inv: 0, kb: 0, kbVx: 0, attack: 0, cool: 0, safe: { x: sx, y: topAt(sx) - 40 } });
  t = 0; resetWorld(); state = 'playing';
}
function fullReset() { checkpoint = 0; attempts = 1; playTime = 0; respawn(); }

// ================= 入力（キーボード＋タッチ） =================
const kb = { left: false, right: false, jump: false, attack: false };
const tc = { left: false, right: false, jump: false, attack: false };
const input = { left: false, right: false, jump: false, attack: false };
let jumpPressed = false, attackPressed = false;
const keyMap = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump', KeyJ: 'attack', KeyX: 'attack', KeyK: 'attack' };
function edge(k, on, prev) { if (on && !prev) { if (k === 'jump') jumpPressed = true; if (k === 'attack') attackPressed = true; } }
function startIfTitle() { if (state === 'title' || state === 'clear') { fullReset(); return true; } return false; }
addEventListener('keydown', e => {
  const k = keyMap[e.code];
  if (k) { e.preventDefault(); if (e.repeat) return; if ((k === 'jump' || k === 'attack') && startIfTitle()) return; edge(k, true, input[k]); kb[k] = true; }
  if (e.code === 'KeyR') fullReset();
});
addEventListener('keyup', e => { const k = keyMap[e.code]; if (k) kb[k] = false; });

const pad = document.getElementById('pad');
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
function enableTouchUI() { pad.classList.add('show'); document.body.classList.add('touch'); }
if (isTouch) enableTouchUI();
const pointers = new Map();
function keyAt(e) { const el = document.elementFromPoint(e.clientX, e.clientY); return el && el.dataset ? el.dataset.key || null : null; }
function syncTouch() {
  const now = { left: false, right: false, jump: false, attack: false };
  for (const k of pointers.values()) if (k in now) now[k] = true;
  for (const k in now) { edge(k, now[k], tc[k] || kb[k]); tc[k] = now[k]; }
  pad.querySelectorAll('.btn').forEach(b => b.classList.toggle('on', !!now[b.dataset.key]));
}
pad.addEventListener('pointerdown', e => {
  e.preventDefault();
  const k = keyAt(e);
  if (k === 'fs') { toggleFullscreen(); return; }
  if (startIfTitle()) return;
  try { pad.setPointerCapture(e.pointerId); } catch (_) {}
  pointers.set(e.pointerId, k); syncTouch();
});
pad.addEventListener('pointermove', e => {               // 指を滑らせてボタンを切り替えられる
  if (!pointers.has(e.pointerId)) return;
  const k = keyAt(e); if (k !== pointers.get(e.pointerId)) { pointers.set(e.pointerId, k === 'fs' ? null : k); syncTouch(); }
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev =>
  pad.addEventListener(ev, e => { if (pointers.delete(e.pointerId)) syncTouch(); }));
addEventListener('blur', () => { pointers.clear(); syncTouch(); for (const k in kb) kb[k] = false; });
addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') enableTouchUI(); startIfTitle(); });
function toggleFullscreen() {
  const d = document, el = d.documentElement;
  if (!d.fullscreenElement && !d.webkitFullscreenElement) {
    const p = el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen && el.webkitRequestFullscreen();
    Promise.resolve(p).then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape')).catch(() => {});
  } else (d.exitFullscreen || d.webkitExitFullscreen).call(d);
}

// ================= 共通 =================
const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const activeSolids = () => gate.active ? solids.concat([gate]) : solids;
function burst(x, y, color, n = 8) {
  for (let i = 0; i < n; i++) particles.push({ x, y, vx: (Math.random() - 0.5) * 6, vy: -Math.random() * 5, life: 30, color });
}
function hurt(dmg, srcX) {
  const P = player;
  if (P.inv > 0 || state !== 'playing') return;
  P.hp -= dmg; P.inv = INVINCIBLE; damageFlash = 10; shake = 6;
  const dir = P.x + P.w / 2 < srcX ? -1 : 1;
  P.kb = 12; P.kbVx = dir * 5; P.vy = -6; P.ground = null;
  if (navigator.vibrate) navigator.vibrate(40);
  if (P.hp <= 0) die();
}
function die() { if (state !== 'playing') return; player.hp = 0; state = 'dead'; deadTimer = 1.0; attempts++; }
function swordBox() {
  const P = player;
  return P.face > 0 ? { x: P.x + P.w - 4, y: P.y - 10, w: SWORD_REACH, h: P.h + 18 }
                    : { x: P.x - SWORD_REACH + 4, y: P.y - 10, w: SWORD_REACH, h: P.h + 18 };
}
const swordActive = () => player.attack > 3 && player.attack <= SWING_TIME - 2;

// ================= 更新：床・プレイヤー =================
function updateMovers() {
  for (const p of movers) {
    const a = 2 * Math.PI * t / p.period + p.phase;
    const nx = p.bx + p.ax * Math.sin(a), ny = p.by + p.ay * Math.sin(a);
    p.dx = nx - p.x; p.dy = ny - p.y; p.x = nx; p.y = ny;
  }
}
function updatePlayer() {
  const P = player;
  if (P.kb > 0) { P.kb--; P.vx = P.kbVx; }
  else { P.vx = (input.right - input.left) * MOVE_SPEED; if (P.vx) P.face = Math.sign(P.vx); }
  if (P.inv > 0) P.inv--;

  if (jumpPressed) P.jbuf = JUMP_BUFFER;
  if (attackPressed) P.abuf = ATTACK_BUFFER;
  jumpPressed = attackPressed = false;
  if (P.ground) P.coyote = COYOTE; else if (P.coyote > 0) P.coyote--;
  if (P.jbuf > 0) { P.jbuf--; if (P.coyote > 0 && P.kb === 0) { P.vy = -JUMP_POWER; P.ground = null; P.coyote = 0; P.jbuf = 0; } }
  if (!input.jump && P.vy < -4 && P.kb === 0) P.vy = -4;

  // 剣
  if (P.cool > 0) P.cool--;
  if (P.attack > 0) P.attack--;
  if (P.abuf > 0) { P.abuf--; if (P.cool === 0) { P.attack = SWING_TIME; P.cool = SWING_COOLDOWN; P.abuf = 0; swingId++; } }

  if (P.ground && P.ground.period) {
    const p = P.ground; P.x += p.dx; P.y = p.y - P.h;
    if (P.x + P.w < p.x || P.x > p.x + p.w) P.ground = null;
  }
  const S = activeSolids();
  P.x += P.vx;
  for (const s of S) if (hit(P, s)) {
    const mid = s.x + s.w / 2; P.x = P.x + P.w / 2 < mid ? s.x - P.w : s.x + s.w;
  }
  if (P.x < 0) P.x = 0;

  const prevBottom = P.y + P.h;
  P.vy = Math.min(P.vy + GRAVITY, FALL_MAX);
  if (P.ground && P.ground.period && P.vy >= 0) P.vy = 0;
  P.y += P.vy;
  const was = P.ground; P.ground = null;
  for (const s of S) if (hit(P, s)) {
    if (P.vy >= 0) { P.y = s.y - P.h; P.ground = s; } else P.y = s.y + s.h;
    P.vy = 0;
  }
  if (!P.ground && P.vy >= 0) for (const p of movers) {
    if (P.x + P.w > p.x && P.x < p.x + p.w && prevBottom <= p.y - p.dy + 2 + Math.max(0, -p.dy) && P.y + P.h >= p.y) {
      P.y = p.y - P.h; P.vy = 0; P.ground = p; break;
    }
  }
  if (!P.ground && was && was.period && P.vy === 0 &&
      P.x + P.w > was.x && P.x < was.x + was.w && Math.abs(P.y + P.h - was.y) < 16) { P.y = was.y - P.h; P.ground = was; }

  // 落ちる前に立っていた安全な場所を覚える
  if (P.ground && !P.ground.period && P.ground !== gate && P.ground.w > 60) {
    const s = P.ground;
    P.safe = { x: Math.max(s.x + 8, Math.min(s.x + s.w - P.w - 8, P.x)), y: s.y - P.h };
  }
  if (P.y > 520) {                                       // 落下：即死ではなくダメージ＋復帰
    P.hp -= FALL_DAMAGE; damageFlash = 10;
    if (navigator.vibrate) navigator.vibrate(60);
    if (P.hp <= 0) { die(); return; }
    Object.assign(P, { x: P.safe.x, y: P.safe.y, vx: 0, vy: 0, kb: 0, ground: null, inv: INVINCIBLE });
  }
  for (const h of hearts) if (!h.taken && hit(P, { x: h.x - 12, y: h.y - 12, w: 24, h: 24 })) {
    h.taken = true; P.hp = Math.min(MAX_HP, P.hp + 3); burst(h.x, h.y, '#f6a', 10);
  }
  if (!checkpoint && P.x >= CHECKPOINT_X) { checkpoint = 1; burst(CHECKPOINT_X + 15, 270, '#3c3', 12); }
  if (!gate.active && P.x > ARENA_L + 60) { gate.active = true; boss.state = 'idle'; boss.timer = 1.2; }
}

// ================= 更新：敵 =================
function fire(x, y, tx, ty, speed) {
  const dx = tx - x, dy = ty - y, d = Math.hypot(dx, dy) || 1;
  shots.push({ kind: 'seed', x, y, vx: dx / d * speed, vy: dy / d * speed, r: 7, life: 240 });
}
function updateEnemies() {
  const P = player, px = P.x + P.w / 2, py = P.y + P.h / 2;
  const sb = swordActive() ? swordBox() : null;
  for (const e of enemies) {
    if (!e.alive) continue;
    if (!e.active) { if (e.x - cameraX < VW + 60) e.active = true; else continue; }
    if (e.flash > 0) e.flash--;
    const ex = e.x + e.w / 2, dist = px - ex;
    e.timer += DT;
    switch (e.type) {
      case 'walk':                                       // うろうろして、近いと速く詰めてくる
        if (Math.abs(dist) < 160 && Math.abs(P.y - e.y) < 60) e.vx = Math.sign(dist) * 2.4;
        else if (Math.abs(e.vx) > 1.6) e.vx = Math.sign(e.vx) * 1.6;
        e.x += e.vx;
        if (e.x < e.min) { e.x = e.min; e.vx = Math.abs(e.vx); } if (e.x > e.max) { e.x = e.max; e.vx = -Math.abs(e.vx); }
        break;
      case 'mini':                                       // 雑魚：ゆっくり往復するだけ
        if (!e.vx) e.vx = (e.sx % 2 ? 1 : -1) * 1.1;
        e.x += e.vx;
        if (e.x < e.min) { e.x = e.min; e.vx = Math.abs(e.vx); } if (e.x > e.max) { e.x = e.max; e.vx = -Math.abs(e.vx); }
        break;
      case 'hop':                                        // プレイヤーへ向かって跳ねる
        e.vy += GRAVITY; e.y += e.vy; e.x += e.vx;
        if (e.y >= e.floor - e.h) { e.y = e.floor - e.h; e.vy = 0; e.vx = 0;
          if (e.timer > 1.1) { e.timer = 0; e.vy = -10; e.vx = Math.sign(dist) * 3; } }
        e.x = Math.max(e.min, Math.min(e.max, e.x));
        break;
      case 'shoot':                                      // 光ってから種を撃つ
        e.dir = Math.sign(dist) || -1;
        if (Math.abs(dist) < 560) {
          if (e.state === 'idle' && e.timer > 1.3) { e.state = 'charge'; e.timer = 0; }
          if (e.state === 'charge' && e.timer > 0.4) {
            fire(ex, e.y + 10, px, py, 4.5); e.state = 'idle'; e.timer = 0;
          }
        }
        break;
      case 'bee':                                        // 漂う → 狙いを付けて急降下 → 戻る
        if (e.state === 'idle') {
          e.x += Math.sin(t * 2 + e.sx) * 1.2; e.y = e.baseY + Math.sin(t * 3 + e.sx) * 20;
          if (Math.abs(dist) < 260 && e.timer > 1.2) { e.state = 'aim'; e.timer = 0; }
        } else if (e.state === 'aim') {
          if (e.timer > 0.35) { const d = Math.hypot(dist, py - e.y) || 1; e.vx = dist / d * 6; e.vy = (py - e.y) / d * 6; e.state = 'dive'; e.timer = 0; }
        } else if (e.state === 'dive') {
          e.x += e.vx; e.y += e.vy;
          if (e.timer > 0.7 || e.y > e.floor - e.h) { e.state = 'back'; e.timer = 0; }
        } else {
          e.y += (e.baseY - e.y) * 0.06; e.x += (e.sx - e.x) * 0.03;
          if (e.timer > 1) { e.state = 'idle'; e.timer = 0; }
        }
        break;
      case 'boar':                                       // 前を見て、足をかいてから突進
        if (e.state === 'idle') {
          e.dir = Math.sign(dist) || -1;
          if (Math.abs(dist) < 360 && Math.abs(P.y - e.y) < 80 && e.timer > 0.8) { e.state = 'prep'; e.timer = 0; }
        } else if (e.state === 'prep') {
          if (e.timer > 0.5) { e.state = 'run'; e.timer = 0; e.vx = e.dir * 6.5; }
        } else {
          e.x += e.vx;
          if (e.timer > 1.0 || e.x < e.min - 120 || e.x > e.max + 120) { e.state = 'idle'; e.timer = 0; }
        }
        break;
    }
    // 剣が当たった
    if (sb && e.lastSwing !== swingId && hit(sb, e)) {
      e.lastSwing = swingId; e.hp--; e.flash = 8; hitStop = 3;
      e.x += P.face * 14; if (e.type === 'boar' && e.state === 'run') { e.state = 'idle'; e.timer = 0; }
      burst(ex, e.y + e.h / 2, '#fff', 5);
      if (e.hp <= 0) { e.alive = false; burst(ex, e.y + e.h / 2, '#ffb', 14); continue; }
    }
    // 踏みつけ（1ダメージ）／体当たり
    if (hit(P, e)) {
      if (P.vy > 0 && P.y + P.h - P.vy <= e.y + 10) {
        P.vy = input.jump ? -11 : -7; e.hp--; e.flash = 8;
        if (e.hp <= 0) { e.alive = false; burst(ex, e.y, '#ffb', 14); }
      } else hurt(e.dmg, ex);
    }
  }
}
function updateShots() {
  const P = player, sb = swordActive() ? swordBox() : null;
  for (const s of shots) {
    if (s.kind === 'rock' && s.warn > 0) { s.warn--; continue; }
    if (s.kind === 'rock') s.vy = Math.min(s.vy + 0.5, 12);
    s.x += s.vx; s.y += s.vy; s.life--;
    const box = s.kind === 'seed' ? { x: s.x - s.r, y: s.y - s.r, w: s.r * 2, h: s.r * 2 } : { x: s.x, y: s.y, w: s.w, h: s.h };
    if (sb && s.kind !== 'wave' && hit(sb, box)) { s.life = 0; burst(s.x, s.y, '#fff', 4); continue; }  // 剣で弾ける
    if (hit(P, box)) { hurt(s.dmg || 1, s.x); s.life = 0; continue; }
    if (s.kind === 'rock' && s.y > 330) { s.life = 0; burst(s.x + 12, 350, '#998', 6); }
    if (s.kind === 'wave' && (s.x < ARENA_L || s.x > ARENA_R)) s.life = 0;
    if (s.kind === 'seed') for (const so of solids) if (hit(box, so)) { s.life = 0; break; }
  }
  shots = shots.filter(s => s.life > 0);
}

// ================= 更新：ボス =================
function bossTier() { return boss.hp > 8 ? 0 : boss.hp > 4 ? 1 : 2; }
const CHARGE_SPEED = [7, 8.5, 10], STUN_TIME = [1.8, 1.4, 1.1];
function updateBoss() {
  const B = boss, P = player;
  if (B.state === 'wait') return;
  if (B.flash > 0) B.flash--;
  B.timer -= DT;
  const tier = bossTier();
  switch (B.state) {
    case 'idle':
      B.dir = Math.sign(P.x - B.x) || -1;
      if (B.timer <= 0) {
        if (tier >= 1 && !B.hopped) { B.state = 'hopPrep'; B.timer = 0.5; }
        else { B.state = 'prep'; B.timer = 0.7; }
      }
      break;
    case 'hopPrep':
      if (B.timer <= 0) {
        const target = Math.max(ARENA_L, Math.min(ARENA_R - B.w, P.x - B.w / 2));
        B.vy = -13; B.vx = (target - B.x) / 43; B.state = 'hop'; B.hopped = true;
      }
      break;
    case 'hop':
      B.vy += GRAVITY; B.x += B.vx; B.y += B.vy;
      B.x = Math.max(ARENA_L, Math.min(ARENA_R - B.w, B.x));
      if (B.y >= 300) {                                  // 着地で左右に衝撃波（跳んでかわす）
        B.y = 300; B.vy = 0; shake = 10; B.state = 'prep'; B.timer = 0.7; B.dir = Math.sign(P.x - B.x) || -1;
        for (const d of [-1, 1]) shots.push({ kind: 'wave', x: B.x + B.w / 2 - 9, y: 338, w: 18, h: 22, vx: d * 5, vy: 0, life: 300, dmg: 2 });
      }
      break;
    case 'prep':
      if (B.timer <= 0) { B.state = 'charge'; B.vx = B.dir * CHARGE_SPEED[tier]; }
      break;
    case 'charge':
      B.x += B.vx;
      if (B.x <= ARENA_L || B.x + B.w >= ARENA_R) {
        B.x = Math.max(ARENA_L, Math.min(ARENA_R - B.w, B.x));
        B.state = 'stun'; B.timer = STUN_TIME[tier]; shake = 14;
        if (tier === 2) for (const off of [-140, 0, 140])  // 壁にぶつかると岩が落ちる（影で予告）
          shots.push({ kind: 'rock', x: P.x + off, y: -30, w: 24, h: 24, vx: 0, vy: 0, warn: 40, life: 200, dmg: 1 });
      }
      break;
    case 'stun':
      if (B.timer <= 0) { B.state = 'idle'; B.timer = 0.8; B.hopped = false; }
      break;
    case 'dead': break;
  }
  if (B.state === 'dead') return;
  // 剣：突進中は弾かれる。気絶中は2ダメージ
  if (swordActive() && B.lastSwing !== swingId && hit(swordBox(), B)) {
    B.lastSwing = swingId;
    if (B.state === 'charge') { burst(B.x + B.w / 2, B.y + 20, '#ccc', 4); P.kb = 8; P.kbVx = -P.face * 4; }
    else { B.hp -= B.state === 'stun' ? 2 : 1; B.flash = 8; hitStop = 4; burst(B.x + B.w / 2, B.y + 20, '#fff', 8); }
  }
  if (hit(P, B)) {
    const stomp = P.vy > 0 && P.y + P.h - P.vy <= B.y + 12;
    if (stomp) { P.vy = -10; if (B.state === 'stun') { B.hp -= 1; B.flash = 8; } }
    else if (B.state !== 'stun') hurt(B.state === 'charge' ? 3 : 2, B.x + B.w / 2);
  }
  if (B.hp <= 0) { B.hp = 0; B.state = 'dead'; clearTimer = 1.5; shots = []; burst(B.x + B.w / 2, B.y + 30, '#fc6', 30); }
}

function update() {
  if (state === 'title' || state === 'clear') return;
  if (state === 'dead') { deadTimer -= DT; if (deadTimer <= 0) respawn(); return; }
  if (hitStop > 0) { hitStop--; return; }               // 当たった瞬間の手応え
  Object.assign(input, { left: kb.left || tc.left, right: kb.right || tc.right, jump: kb.jump || tc.jump, attack: kb.attack || tc.attack });
  t += DT; playTime += DT;
  updateMovers(); updatePlayer(); if (state !== 'playing') return;
  updateEnemies(); updateShots(); updateBoss();
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life--; }
  particles = particles.filter(p => p.life > 0);
  if (boss.state === 'dead') { clearTimer -= DT; if (clearTimer <= 0) state = 'clear'; }
  const minCam = gate.active ? ARENA_L - 40 : 0;
  const target = Math.max(minCam, Math.min(player.x + player.face * 60 - VW / 2.6, WORLD_W - VW));
  cameraX += (target - cameraX) * 0.15;                  // カメラはなめらかに追う
  if (shake > 0) shake--;
  if (damageFlash > 0) damageFlash--;
}

// ================= 描画 =================
function drawEnemy(e) {
  const c = { mini: '#4a8cff', walk: '#7a3fbf', hop: '#3fbf6a', shoot: '#e0559a', bee: '#f0c020', boar: '#7a4a2a' }[e.type];
  ctx.fillStyle = e.flash ? '#fff' : (e.type === 'shoot' && e.state === 'charge' ? '#ff4' : (e.type === 'boar' && e.state === 'prep') || (e.type === 'bee' && e.state === 'aim') ? '#f44' : c);
  ctx.fillRect(e.x, e.y, e.w, e.h);
  if (e.type === 'bee') { ctx.fillStyle = '#222'; ctx.fillRect(e.x + 8, e.y, 4, e.h); ctx.fillRect(e.x + 16, e.y, 4, e.h); }
  ctx.fillStyle = '#fff'; ctx.fillRect(e.x + 6, e.y + 6, 5, 5); ctx.fillRect(e.x + e.w - 11, e.y + 6, 5, 5);
  if (e.hp < e.maxHp) { ctx.fillStyle = '#000'; ctx.fillRect(e.x, e.y - 7, e.w, 4); ctx.fillStyle = '#f44'; ctx.fillRect(e.x, e.y - 7, e.w * e.hp / e.maxHp, 4); }
}
function drawHeart(x, y, s, fill) {
  ctx.fillStyle = fill; ctx.beginPath();
  ctx.moveTo(x, y + s * 0.3); ctx.arc(x - s * 0.25, y, s * 0.27, Math.PI * 0.8, 0); ctx.arc(x + s * 0.25, y, s * 0.27, Math.PI, Math.PI * 0.2);
  ctx.lineTo(x, y + s * 0.65); ctx.closePath(); ctx.fill();
}
function draw() {
  ctx.clearRect(0, 0, VW, VH);
  ctx.save();
  ctx.translate(-Math.round(cameraX) + (shake ? (Math.random() - 0.5) * shake : 0), 0);
  ctx.fillStyle = '#7cc47c';
  for (let i = -1; i < 45; i++) { const hx = i * 400 + cameraX * 0.5; ctx.beginPath(); ctx.arc(hx, 400, 180, Math.PI, 0); ctx.fill(); }
  for (const s of solids) { ctx.fillStyle = '#8b5a2b'; ctx.fillRect(s.x, s.y, s.w, s.h); ctx.fillStyle = '#3fa03f'; ctx.fillRect(s.x, s.y, s.w, 8); }
  if (gate.active) { ctx.fillStyle = '#666'; ctx.fillRect(gate.x, gate.y, gate.w, gate.h); }
  ctx.fillStyle = '#d9a441'; for (const p of movers) ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.fillStyle = '#555'; ctx.fillRect(CHECKPOINT_X, topAt(CHECKPOINT_X) - 100, 5, 100);
  ctx.fillStyle = checkpoint ? '#3c3' : '#ccc'; ctx.fillRect(CHECKPOINT_X + 5, topAt(CHECKPOINT_X) - 100, 28, 18);
  for (const h of hearts) if (!h.taken) drawHeart(h.x, h.y - 6 + Math.sin(t * 4) * 3, 24, '#f36');
  for (const e of enemies) if (e.alive && e.active) drawEnemy(e);

  const B = boss;
  if (B.state !== 'dead' || clearTimer > 0) {
    const jit = B.state === 'prep' || B.state === 'hopPrep' ? (Math.random() - 0.5) * 4 : 0;
    const by = B.state === 'hopPrep' ? B.y + 8 : B.y;
    ctx.fillStyle = B.flash ? '#fff' : B.state === 'stun' ? '#a07050' : B.state === 'dead' ? '#777' : '#6b3e1f';
    ctx.fillRect(B.x + jit, by, B.w, B.h - (by - B.y));
    ctx.fillStyle = '#fff'; ctx.fillRect((B.dir > 0 ? B.x + B.w - 8 : B.x - 12) + jit, by + 34, 20, 6);
    ctx.fillStyle = B.state === 'stun' ? '#ff0' : '#f33'; ctx.fillRect((B.dir > 0 ? B.x + B.w - 24 : B.x + 12) + jit, by + 12, 8, 8);
    if (B.state === 'stun') { ctx.fillStyle = '#ff0'; ctx.font = '20px sans-serif'; ctx.fillText('★ ★', B.x + 20, B.y - 8); }
  }
  for (const s of shots) {
    if (s.kind === 'seed') { ctx.fillStyle = '#4a2'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); }
    else if (s.kind === 'wave') { ctx.fillStyle = '#fa4'; ctx.fillRect(s.x, s.y, s.w, s.h); }
    else if (s.warn > 0) { ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(s.x - 4, 354, s.w + 8, 6); }
    else { ctx.fillStyle = '#887'; ctx.fillRect(s.x, s.y, s.w, s.h); }
  }
  const P = player;
  if (state !== 'title' && (state !== 'dead' || Math.floor(deadTimer * 10) % 2) && !(P.inv > 0 && Math.floor(P.inv / 4) % 2)) {
    ctx.fillStyle = '#ffd400'; ctx.fillRect(P.x, P.y, P.w, P.h);
    ctx.fillStyle = '#000'; ctx.fillRect(P.face > 0 ? P.x + 18 : P.x + 4, P.y + 10, 5, 5);
    if (P.attack > 0) {                                   // 剣の軌跡
      const prog = 1 - P.attack / SWING_TIME, cx = P.x + P.w / 2, cy = P.y + 16;
      const a0 = -1.4, a = a0 + prog * 2.6, dirA = ang => P.face > 0 ? ang : Math.PI - ang;
      ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 10; ctx.beginPath();
      P.face > 0 ? ctx.arc(cx, cy, SWORD_REACH - 6, a0, a) : ctx.arc(cx, cy, SWORD_REACH - 6, dirA(a), dirA(a0));
      ctx.stroke();
      ctx.strokeStyle = '#dde'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(dirA(a)) * SWORD_REACH, cy + Math.sin(dirA(a)) * SWORD_REACH); ctx.stroke();
    }
  }
  for (const p of particles) { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 4, 4); }
  ctx.restore();

  if (damageFlash) { ctx.fillStyle = `rgba(255,0,0,${damageFlash / 40})`; ctx.fillRect(0, 0, VW, VH); }
  // HUD
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, VW, 32);
  for (let i = 0; i < MAX_HP; i++) drawHeart(18 + i * 22, 12, 18, i < (P.hp || 0) ? '#f36' : '#444');
  ctx.fillStyle = '#fff'; ctx.font = '15px sans-serif';
  const mm = Math.floor(playTime / 60), ss = String(Math.floor(playTime % 60)).padStart(2, '0');
  ctx.fillText(`挑戦 ${attempts}　${mm}:${ss}　${checkpoint ? '後半' : '前半'}`, 240, 21);
  if (gate.active) {
    ctx.fillText('イノシシ', 470, 21);
    ctx.fillStyle = '#400'; ctx.fillRect(540, 10, 200, 12);
    ctx.fillStyle = '#f33'; ctx.fillRect(540, 10, 200 * boss.hp / boss.maxHp, 12);
  }
  ctx.textAlign = 'center';
  if (state === 'title') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, VW, VH); ctx.fillStyle = '#fff';
    ctx.font = 'bold 40px sans-serif'; ctx.fillText('ステージ1 草原', VW / 2, 140);
    ctx.font = '18px sans-serif';
    ctx.fillText(pad.classList.contains('show') ? '◀ ▶ 移動　⤒ ジャンプ　⚔ 剣　（⛶ で全画面）' : '←→/AD 移動　Space/Z/W ジャンプ　X/J 剣　R やり直し', VW / 2, 200);
    ctx.fillText('剣は種を弾ける・突進中のボスには効かない', VW / 2, 232);
    ctx.font = 'bold 22px sans-serif'; ctx.fillText('タップ / ジャンプキーでスタート', VW / 2, 290);
  } else if (state === 'clear') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, VW, VH); ctx.fillStyle = '#fff';
    ctx.font = 'bold 44px sans-serif'; ctx.fillText('STAGE 1 CLEAR!', VW / 2, 170);
    ctx.font = '20px sans-serif'; ctx.fillText(`挑戦回数 ${attempts} 回　プレイ時間 ${mm}:${ss}`, VW / 2, 220);
    ctx.fillText('タップ / ジャンプキーでもう一度', VW / 2, 260);
  }
  ctx.textAlign = 'left';
}

resetWorld(); respawn(); state = 'title';
(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
